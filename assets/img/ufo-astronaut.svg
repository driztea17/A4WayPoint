<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" role="img" aria-label="An astronaut flying a small UFO">
  <!-- Original illustration for A4 WAYPOINT: a friendly astronaut in a UFO. -->
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#84c318" stop-opacity=".45"/>
      <stop offset="1" stop-color="#84c318" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- soft light beam -->
  <path d="M74 150 L126 150 L150 180 L50 180 Z" fill="url(#beam)"/>

  <!-- glass dome -->
  <circle cx="100" cy="82" r="50" fill="#b9b0f6" fill-opacity=".55" stroke="#0e1440" stroke-width="4"/>
  <path d="M128 50 a34 34 0 0 1 10 22" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  <circle cx="139" cy="84" r="3.5" fill="#fff" opacity=".8"/>

  <!-- helmet -->
  <rect x="66" y="68" width="8" height="18" rx="4" fill="#fff" stroke="#0e1440" stroke-width="3.5"/>
  <rect x="126" y="68" width="8" height="18" rx="4" fill="#fff" stroke="#0e1440" stroke-width="3.5"/>
  <circle cx="100" cy="78" r="29" fill="#fff" stroke="#0e1440" stroke-width="4"/>
  <rect x="80" y="62" width="40" height="32" rx="16" fill="#1b2466" stroke="#0e1440" stroke-width="3.5"/>
  <path d="M88 70 q5-4 11-3" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  <circle cx="112" cy="84" r="2.5" fill="#84c318"/>

  <!-- saucer -->
  <ellipse cx="100" cy="134" rx="86" ry="24" fill="#d9deea" stroke="#0e1440" stroke-width="4"/>
  <path d="M16 136 C 30 158, 170 158, 184 136 C 170 150, 30 150, 16 136 Z" fill="#aeb6cc"/>
  <ellipse cx="100" cy="124" rx="52" ry="10" fill="#e9edf5" stroke="#0e1440" stroke-width="3.5"/>
  <!-- astronaut sitting in the hatch, hands on the rim -->
  <path d="M76 127 c0-15 10-23 24-23 s24 8 24 23 z" fill="#fff" stroke="#0e1440" stroke-width="4" stroke-linejoin="round"/>
  <path d="M93 114 v8 M107 114 v8" stroke="#0e1440" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 124 q40 12 80 0" fill="#e9edf5" stroke="#0e1440" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="78" y="119" width="14" height="10" rx="5" fill="#fff" stroke="#0e1440" stroke-width="3"/>
  <rect x="108" y="119" width="14" height="10" rx="5" fill="#fff" stroke="#0e1440" stroke-width="3"/>
  <ellipse cx="100" cy="134" rx="86" ry="24" fill="none" stroke="#0e1440" stroke-width="4"/>

  <!-- lights -->
  <circle cx="42" cy="136" r="7" fill="#f6c445" stroke="#0e1440" stroke-width="3"/>
  <circle cx="100" cy="146" r="7" fill="#84c318" stroke="#0e1440" stroke-width="3"/>
  <circle cx="158" cy="136" r="7" fill="#f6c445" stroke="#0e1440" stroke-width="3"/>

  <!-- legs -->
  <rect x="68" y="152" width="16" height="12" rx="6" fill="#fff" stroke="#0e1440" stroke-width="3.5"/>
  <rect x="116" y="152" width="16" height="12" rx="6" fill="#fff" stroke="#0e1440" stroke-width="3.5"/>
</svg>
